# /etc/nginx/conf.d/quantar-rpc-limits.conf  (contexto http)
# Limites da RPC publica da testnet. Leitura: 10 req/s por IP.
# Envio de transacao: 1 req/s por IP, rajada de 5. Cada tx custa ~2,6 ms de
# verificacao HYDRA-X no node, entao o limite protege a CPU do droplet.
limit_req_zone $binary_remote_addr zone=qtr_read:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=qtr_tx:10m   rate=1r/s;
limit_req_status 429;
