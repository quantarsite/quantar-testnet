[package]
name        = "qtrc-wallet"
description = "Quantar testnet wallet: post-quantum HYDRA-X keys, balance, send, faucet"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[[bin]]
name = "qtrc-wallet"
path = "src/main.rs"

[dependencies]
qtrc-crypto.path = "../qtrc-crypto"
qtrc-common.path = "../qtrc-common"
qtrc-sentinel.path = "../qtrc-sentinel"
# Commit proofs: the same check the nodes run on blocks decided by votes
qtrc-bft.path = "../qtrc-bft"
rand.workspace = true
hex.workspace = true
serde.workspace = true
clap = { workspace = true, features = ["env"] }
serde_json.workspace = true
anyhow.workspace     = true
chrono.workspace     = true
zeroize = "1"
# rustls so the prebuilt Windows/macOS/Linux binaries need no OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
